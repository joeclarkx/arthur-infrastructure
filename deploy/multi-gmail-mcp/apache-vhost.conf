# Apache reverse-proxy vhost for multi-gmail-cowork-mcp on Arthur.
# Installed to /etc/apache2/sites-available/multi-gmail-mcp.conf by deploy.sh,
# which then runs certbot to add the :443 block and the HTTP to HTTPS redirect.

<VirtualHost *:80>
    ServerName mail.mcp.joeclark.photo

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3003/
    ProxyPassReverse / http://127.0.0.1:3003/

    ErrorLog ${APACHE_LOG_DIR}/multi-gmail-mcp-error.log
    CustomLog ${APACHE_LOG_DIR}/multi-gmail-mcp-access.log combined
</VirtualHost>
