# Static pages at apps.joeclark.photo (currently: home page + privacy policy for the
# Docs Quick Look Google OAuth app, which Google requires before the app can be published).
# Installed to /etc/apache2/sites-available/apps.joeclark.photo.conf by deploy.sh,
# which then runs certbot to add the :443 block and the HTTP to HTTPS redirect.

<VirtualHost *:80>
    ServerName apps.joeclark.photo
    DocumentRoot /var/www/apps-joeclark-photo

    <Directory /var/www/apps-joeclark-photo>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/apps_joeclark_photo_error.log
    CustomLog ${APACHE_LOG_DIR}/apps_joeclark_photo_access.log combined
</VirtualHost>
