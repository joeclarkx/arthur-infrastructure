# Apache reverse-proxy vhost template for self-hosted Umami on Arthur.
# Replace ANALYTICS_SUBDOMAIN before use. Not installed by any script here;
# see docs/plans/umami-self-hosted-analytics.md for the full runbook. Get the
# cert with certbot the same way other vhosts on this box are provisioned,
# then certbot will rewrite this into the :443 block itself.

<VirtualHost *:80>
    ServerName ANALYTICS_SUBDOMAIN

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3001/
    ProxyPassReverse / http://127.0.0.1:3001/

    ErrorLog ${APACHE_LOG_DIR}/umami-error.log
    CustomLog ${APACHE_LOG_DIR}/umami-access.log combined
</VirtualHost>
