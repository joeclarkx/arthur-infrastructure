# Apache reverse-proxy vhost for self-hosted Umami on Arthur.
# Installed to /etc/apache2/sites-available/umami.conf, then `a2ensite umami`.
# Get the cert with `certbot --apache -d umami.joeclark.photo` once DNS points
# here; certbot will rewrite this into the :443 block itself.

<VirtualHost *:80>
    ServerName umami.joeclark.photo

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3002/
    ProxyPassReverse / http://127.0.0.1:3002/

    ErrorLog ${APACHE_LOG_DIR}/umami-error.log
    CustomLog ${APACHE_LOG_DIR}/umami-access.log combined
</VirtualHost>
